<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор ключей</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            padding: 20px;
        }
        
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #555;
        }
        
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        button {
            background-color: #6e8efb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #5a7df7;
        }
        
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f5f5f5;
            border-radius: 5px;
            word-break: break-all;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .button-group button {
            flex: 1;
        }
        
        .copy-btn {
            background-color: #a777e3;
        }
        
        .copy-btn:hover {
            background-color: #9566d2;
        }
        
        .save-btn {
            background-color: #4CAF50;
        }
        
        .save-btn:hover {
            background-color: #3e8e41;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .tab-container {
            margin-bottom: 1.5rem;
        }
        
        .tab-buttons {
            display: flex;
            border-bottom: 1px solid #ddd;
        }
        
        .tab-button {
            padding: 10px 15px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: #777;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab-button.active {
            color: #6e8efb;
            border-bottom: 2px solid #6e8efb;
        }
        
        .tab-content {
            display: none;
            padding: 15px 0;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .github-auth {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: #f8f8f8;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        
        #keys-list {
            margin-top: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .key-item {
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            background-color: #f5f5f5;
            border-radius: 5px;
            border-left: 4px solid #6e8efb;
        }
        
        .key-item .key-value {
            font-family: monospace;
            word-break: break-all;
        }
        
        .key-item .key-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #777;
            margin-top: 0.5rem;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        
        .loading:after {
            content: " ";
            display: block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid #6e8efb;
            border-color: #6e8efb transparent #6e8efb transparent;
            animation: loading 1.2s linear infinite;
        }
        
        @keyframes loading {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Генератор ключей</h1>
        
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="generator">Генератор</button>
                <button class="tab-button" data-tab="github">GitHub</button>
                <button class="tab-button" data-tab="history">Ключи</button>
            </div>
            
            <div class="tab-content active" id="generator-tab">
                <div class="form-group">
                    <label for="key-type">Тип ключа:</label>
                    <select id="key-type">
                        <option value="random">Случайный</option>
                        <option value="uuid">UUID</option>
                        <option value="alphanumeric">Буквенно-цифровой</option>
                        <option value="hex">Шестнадцатеричный</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="key-length">Длина ключа:</label>
                    <input type="number" id="key-length" value="16" min="4" max="64">
                </div>
                
                <button id="generate-btn">Сгенерировать ключ</button>
                
                <div class="result" id="result"></div>
                
                <div class="button-group">
                    <button class="copy-btn" id="copy-btn">Копировать</button>
                    <button class="save-btn" id="save-btn">Сохранить в GitHub</button>
                </div>
            </div>
            
            <div class="tab-content" id="github-tab">
                <div id="github-login" class="github-auth">
                    <div class="form-group">
                        <label for="repo-owner">Имя пользователя GitHub:</label>
                        <input type="text" id="repo-owner" placeholder="username">
                    </div>
                    
                    <div class="form-group">
                        <label for="repo-name">Имя репозитория:</label>
                        <input type="text" id="repo-name" placeholder="repository">
                    </div>
                    
                    <div class="form-group">
                        <label for="token">Токен доступа GitHub:</label>
                        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
                        <small style="display: block; margin-top: 5px; color: #777;">
                            Требуется личный токен доступа с правами на репозиторий.
                            <a href="https://github.com/settings/tokens" target="_blank">Создать токен</a>
                        </small>
                    </div>
                    
                    <div class="form-group">
                        <label for="file-path">Путь к YAML файлу:</label>
                        <input type="text" id="file-path" placeholder="keys.yml" value="keys.yml">
                    </div>
                    
                    <button id="save-github-settings">Сохранить настройки</button>
                </div>
                
                <div id="github-connected" class="hidden">
                    <div style="padding: 1rem; background-color: #e7f7e7; border-radius: 5px; margin-bottom: 1rem;">
                        <strong>Подключено к GitHub!</strong>
                        <p style="margin-top: 0.5rem;">
                            Репозиторий: <span id="connected-repo"></span><br>
                            Файл: <span id="connected-file"></span>
                        </p>
                    </div>
                    <button id="logout-github">Выйти</button>
                </div>
            </div>
            
            <div class="tab-content" id="history-tab">
                <h2>Сохраненные ключи</h2>
                <button id="refresh-keys" style="margin-top: 10px;">Обновить список</button>
                <div id="loading-keys" class="loading hidden"></div>
                <div id="keys-list">
                    <p id="no-keys-message">Нет сохраненных ключей или не настроено подключение к GitHub.</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast">Скопировано в буфер обмена!</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const keyTypeSelect = document.getElementById('key-type');
            const keyLengthInput = document.getElementById('key-length');
            const generateBtn = document.getElementById('generate-btn');
            const resultDiv = document.getElementById('result');
            const copyBtn = document.getElementById('copy-btn');
            const saveBtn = document.getElementById('save-btn');
            const toast = document.getElementById('toast');
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');
            const saveGithubSettingsBtn = document.getElementById('save-github-settings');
            const repoOwnerInput = document.getElementById('repo-owner');
            const repoNameInput = document.getElementById('repo-name');
            const tokenInput = document.getElementById('token');
            const filePathInput = document.getElementById('file-path');
            const githubLoginDiv = document.getElementById('github-login');
            const githubConnectedDiv = document.getElementById('github-connected');
            const connectedRepoSpan = document.getElementById('connected-repo');
            const connectedFileSpan = document.getElementById('connected-file');
            const logoutGithubBtn = document.getElementById('logout-github');
            const refreshKeysBtn = document.getElementById('refresh-keys');
            const keysListDiv = document.getElementById('keys-list');
            const noKeysMessage = document.getElementById('no-keys-message');
            const loadingKeysDiv = document.getElementById('loading-keys');
            
            let currentKey = '';
            let currentKeyType = '';
            let githubConfig = JSON.parse(localStorage.getItem('githubConfig') || 'null');
            
            if (githubConfig) {
                repoOwnerInput.value = githubConfig.owner;
                repoNameInput.value = githubConfig.repo;
                tokenInput.value = githubConfig.token;
                filePathInput.value = githubConfig.path;
                updateGithubStatus(true);
            }
            
            // Переключение вкладок
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const tabId = button.getAttribute('data-tab');
                    
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    
                    button.classList.add('active');
                    document.getElementById(`${tabId}-tab`).classList.add('active');
                    
                    if (tabId === 'history' && githubConfig) {
                        loadKeysFromGithub();
                    }
                });
            });
            
            saveGithubSettingsBtn.addEventListener('click', () => {
                const owner = repoOwnerInput.value.trim();
                const repo = repoNameInput.value.trim();
                const token = tokenInput.value.trim();
                const path = filePathInput.value.trim() || 'keys.yml';
                
                if (!owner || !repo || !token) {
                    showToast('Пожалуйста, заполните все поля', '#f44336');
                    return;
                }
                
                const config = { owner, repo, token, path };
                localStorage.setItem('githubConfig', JSON.stringify(config));
                githubConfig = config;
                
                updateGithubStatus(true);
                showToast('Настройки GitHub сохранены', '#4CAF50');
                
                // Проверяем доступность репозитория
                testGithubConnection();
            });
            
            logoutGithubBtn.addEventListener('click', () => {
                localStorage.removeItem('githubConfig');
                githubConfig = null;
                updateGithubStatus(false);
                showToast('Отключено от GitHub', '#333');
            });
            
            refreshKeysBtn.addEventListener('click', () => {
                if (githubConfig) {
                    loadKeysFromGithub();
                } else {
                    showToast('Сначала настройте подключение к GitHub', '#f44336');
                }
            });
            
            keyTypeSelect.addEventListener('change', () => {
                const keyType = keyTypeSelect.value;
                if (keyType === 'uuid') {
                    keyLengthInput.value = 36;
                    keyLengthInput.disabled = true;
                } else {
                    keyLengthInput.disabled = false;
                }
            });
            
            generateBtn.addEventListener('click', generateKey);
            copyBtn.addEventListener('click', copyToClipboard);
            saveBtn.addEventListener('click', saveKeyToGithub);
            
            function updateGithubStatus(isConnected) {
                if (isConnected && githubConfig) {
                    githubLoginDiv.classList.add('hidden');
                    githubConnectedDiv.classList.remove('hidden');
                    connectedRepoSpan.textContent = `${githubConfig.owner}/${githubConfig.repo}`;
                    connectedFileSpan.textContent = githubConfig.path;
                    saveBtn.disabled = false;
                } else {
                    githubLoginDiv.classList.remove('hidden');
                    githubConnectedDiv.classList.add('hidden');
                    saveBtn.disabled = true;
                }
            }
            
            function testGithubConnection() {
                if (!githubConfig) return;
                
                const { owner, repo, token, path } = githubConfig;
                
                fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                })
                .then(response => {
                    if (response.status === 404) {
                        // Файл не существует, но репозиторий доступен
                        showToast('Репозиторий доступен, но файл не найден. Он будет создан при сохранении ключа.', '#ff9800');
                        return;
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    showToast('Подключение к GitHub успешно!', '#4CAF50');
                })
                .catch(error => {
                    console.error('Ошибка при проверке подключения к GitHub:', error);
                    showToast('Ошибка подключения к GitHub. Проверьте настройки и токен доступа.', '#f44336');
                });
            }
            
            function generateKey() {
                const keyType = keyTypeSelect.value;
                const keyLength = parseInt(keyLengthInput.value);
                
                let key = '';
                
                switch (keyType) {
                    case 'random':
                        key = generateRandomKey(keyLength);
                        break;
                    case 'uuid':
                        key = generateUUID();
                        break;
                    case 'alphanumeric':
                        key = generateAlphanumericKey(keyLength);
                        break;
                    case 'hex':
                        key = generateHexKey(keyLength);
                        break;
                }
                
                resultDiv.textContent = key;
                currentKey = key;
                currentKeyType = keyType;
            }
            
            function generateRandomKey(length) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+[]{}|;:,.<>?';
                return generateKeyFromCharset(chars, length);
            }
            
            function generateAlphanumericKey(length) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                return generateKeyFromCharset(chars, length);
            }
            
            function generateHexKey(length) {
                const chars = '0123456789ABCDEF';
                return generateKeyFromCharset(chars, length);
            }
            
            function generateKeyFromCharset(charset, length) {
                let result = '';
                const charsetLength = charset.length;
                
                for (let i = 0; i < length; i++) {
                    result += charset.charAt(Math.floor(Math.random() * charsetLength));
                }
                
                return result;
            }
            
            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }
            
            function copyToClipboard() {
                const text = resultDiv.textContent;
                if (!text) return;
                
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Скопировано в буфер обмена!');
                }).catch(err => {
                    console.error('Не удалось скопировать текст: ', err);
                });
            }
            
            function saveKeyToGithub() {
                if (!githubConfig) {
                    showToast('Сначала настройте подключение к GitHub', '#f44336');
                    return;
                }
                
                if (!currentKey) {
                    showToast('Сначала сгенерируйте ключ!', '#f44336');
                    return;
                }
                
                const { owner, repo, token, path } = githubConfig;
                
                // Получаем текущее содержимое файла
                fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                })
                .then(response => {
                    if (response.status === 404) {
                        // Файл не существует, создаем новый
                        return { content: null, sha: null };
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    return response.json();
                })
                .then(data => {
                    let keys = [];
                    let sha = null;
                    
                    if (data.content) {
                        const decodedContent = atob(data.content);
                        try {
                            keys = jsyaml.load(decodedContent) || [];
                            if (!Array.isArray(keys)) keys = [];
                        } catch (e) {
                            console.error('Ошибка при парсинге YAML:', e);
                            keys = [];
                        }
                        sha = data.sha;
                    }
                    
                    // Добавляем новый ключ
                    const newKey = {
                        value: currentKey,
                        type: currentKeyType,
                        created_at: new Date().toISOString()
                    };
                    
                    keys.unshift(newKey);
                    
                    // Ограничиваем количество ключей до 100
                    if (keys.length > 100) {
                        keys = keys.slice(0, 100);
                    }
                    
                    // Сериализуем в YAML
                    const yamlContent = jsyaml.dump(keys);
                    
                    // Обновляем файл на GitHub
                    return updateGithubFile(path, yamlContent, sha);
                })
                .then(response => {
                    if (response.ok) {
                        showToast('Ключ успешно сохранен в GitHub!', '#4CAF50');
                    } else {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                })
                .catch(error => {
                    console.error('Ошибка при сохранении ключа:', error);
                    showToast('Ошибка при сохранении ключа!', '#f44336');
                });
            }
            
            function updateGithubFile(path, content, sha) {
                const { owner, repo, token } = githubConfig;
                
                const body = {
                    message: 'Добавлен новый ключ',
                    content: btoa(content),
                    branch: 'main'
                };
                
                if (sha) {
                    body.sha = sha;
                }
                
                return fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(body)
                });
            }
            
            function loadKeysFromGithub() {
                if (!githubConfig) return;
                
                const { owner, repo, token, path } = githubConfig;
                
                keysListDiv.innerHTML = '';
                noKeysMessage.style.display = 'none';
                loadingKeysDiv.classList.remove('hidden');
                
                fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                })
                .then(response => {
                    if (response.status === 404) {
                        throw new Error('Файл не найден');
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    return response.json();
                })
                .then(data => {
                    const decodedContent = atob(data.content);
                    let keys = [];
                    
                    try {
                        keys = jsyaml.load(decodedContent) || [];
                        if (!Array.isArray(keys)) {
                            throw new Error('Неверный формат данных');
                        }
                    } catch (e) {
                        console.error('Ошибка при парсинге YAML:', e);
                        throw new Error('Ошибка при парсинге YAML');
                    }
                    
                    if (keys.length === 0) {
                        throw new Error('Нет сохраненных ключей');
                    }
                    
                    renderKeysList(keys);
                })
                .catch(error => {
                    console.error('Ошибка при загрузке ключей:', error);
                    noKeysMessage.textContent = error.message || 'Ошибка при загрузке ключей';
                    noKeysMessage.style.display = 'block';
                })
                .finally(() => {
                    loadingKeysDiv.classList.add('hidden');
                });
            }
            
            function renderKeysList(keys) {
                keysListDiv.innerHTML = '';
                
                keys.forEach(key => {
                    const keyItem = document.createElement('div');
                    keyItem.className = 'key-item';
                    
                    const keyValue = document.createElement('div');
                    keyValue.className = 'key-value';
                    keyValue.textContent = key.value;
                    
                    const keyMeta = document.createElement('div');
                    keyMeta.className = 'key-meta';
                    
                    const keyType = document.createElement('span');
                    keyType.textContent = getKeyTypeName(key.type);
                    
                    const keyDate = document.createElement('span');
                    keyDate.textContent = formatDate(new Date(key.created_at));
                    
                    keyMeta.appendChild(keyType);
                    keyMeta.appendChild(keyDate);
                    
                    keyItem.appendChild(keyValue);
                    keyItem.appendChild(keyMeta);
                    
                    keyItem.addEventListener('click', () => {
                        navigator.clipboard.writeText(key.value).then(() => {
                            showToast('Ключ скопирован в буфер обмена!');
                        });
                    });
                    
                    keysListDiv.appendChild(keyItem);
                });
            }
            
            function getKeyTypeName(type) {
                switch(type) {
                    case 'random': return 'Случайный';
                    case 'uuid': return 'UUID';
                    case 'alphanumeric': return 'Буквенно-цифровой';
                    case 'hex': return 'Шестнадцатеричный';
                    default: return type;
                }
            }
            
            function formatDate(date) {
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                
                return `${day}.${month}.${year} ${hours}:${minutes}`;
            }
            
            function showToast(message, color = '#333') {
                toast.textContent = message;
                toast.style.backgroundColor = color;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
            
            // Генерируем ключ при загрузке страницы
            generateKey();
        });
    </script>
</body>
</html>
